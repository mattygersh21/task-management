spring.application.name=task-management
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Admin@2024
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=DEBUG

# Flyway owns schema changes; Hibernate must not create or update tables.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# DTOs are assembled inside service transactions; views must not trigger queries.
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
